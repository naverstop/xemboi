[project]
name = "saju-agent"
version = "0.1.0"
description = "사주 상담 LLM 챗봇 (Qwen2.5-7B + RAG + QLoRA)"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    # ---- 사주 계산 엔진 (Phase 1) ----
    "sxtwl>=2.0.6",
    "korean-lunar-calendar>=0.3.1",

    # ---- 문서 파싱 / OCR (Phase 2) ----
    "pypdf>=4.3.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    # OCR은 별도 설치 (paddleocr / easyocr) - 무거움

    # ---- RAG / 임베딩 (Phase 2) ----
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.11.0",
    "tiktoken>=0.7.0",

    # ---- LLM 클라이언트 (내부 Ollama) ----
    "httpx>=0.27.0",
    "ollama>=0.3.0",

    # ---- 외부 LLM (듀얼 LLM 보강) ----
    "anthropic>=0.40.0",            # 기본 프로바이더 (Claude)
    "google-generativeai>=0.7.0",   # 레거시 프로바이더 (Gemini)

    # ---- 웹 백엔드 (Phase 3) ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # ---- Web Push (PWA 알림) ----
    "pywebpush>=2.0.0",

    # ---- 유틸 ----
    "loguru>=0.7.0",
    "tenacity>=9.0.0",
    "apscheduler>=3.10.4",

    # ---- B-6 공유 카드 (QR 워터마크, 순수 파이썬) ----
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "ipython>=8.27.0",
    "rich>=13.8.0",
]
ocr = [
    # GPU OCR (RTX 3050 활용). 설치 무거움: ~2GB
    "paddlepaddle-gpu>=2.6.0; sys_platform == 'win32'",
    "paddleocr>=2.8.0",
]
training = [
    # QLoRA 학습 (Phase 7, 5060 Ti에서). 별도 설치 권장
    # torch는 CUDA 빌드를 별도 명령으로 설치: 아래 README 참고
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",  # Windows: bitsandbytes-windows 별도
]
youtube = [
    # Phase 6: YouTube 데이터 수집
    "yt-dlp>=2024.10.7",
    "youtube-transcript-api>=0.6.2",
    "faster-whisper>=1.0.3",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/eval"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
